<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MQTT Dashboard</title>
<script src="/chart.js"></script>
<style>
* { -webkit-box-sizing:border-box; box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; }
body { background:#2b2b2b; color:#fff;
  font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent; }

#topbar {
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-align-items:center; align-items:center;
  -webkit-justify-content:space-between; justify-content:space-between;
  padding:9px 14px; background:#1a1a1a;
  border-bottom:1px solid #333; position:sticky; top:0; z-index:50;
}
#topbar h2 { font-size:15px; font-weight:600; letter-spacing:0.3px; }
#rangeSelect {
  background:#333; color:#fff; border:1px solid #555; border-radius:4px;
  padding:5px 6px; font-size:13px; -webkit-appearance:none; appearance:none;
}

#addBtn {
  position:fixed; bottom:22px; right:22px;
  width:52px; height:52px; border-radius:50%;
  background:#0078d7; color:#fff; font-size:28px;
  border:none; cursor:pointer; z-index:100;
  line-height:52px; text-align:center; padding:0;
  -webkit-box-shadow:0 4px 16px rgba(0,120,215,.6);
  box-shadow:0 4px 16px rgba(0,120,215,.6);
}
#addBtn:active { opacity:.75; }

#dashboard { padding-bottom:90px; }

.group-section { margin:10px 8px 0; border-radius:10px; overflow:hidden; }
.group-header {
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-align-items:center; align-items:center;
  padding:8px 12px; cursor:pointer;
  -webkit-user-select:none; user-select:none;
}
.group-header-title { -webkit-flex:1; flex:1; font-size:13px; font-weight:700; letter-spacing:0.5px; }
.group-toggle { background:none; border:none; color:#fff; font-size:16px; cursor:pointer; padding:0 6px 0 0; line-height:1; }
.group-hbtn {
  background:rgba(0,0,0,.25); color:#fff; border:none;
  border-radius:4px; width:22px; height:22px;
  font-size:11px; cursor:pointer; padding:0; margin-left:4px;
  line-height:22px; text-align:center;
}
.group-body { padding:0 0 6px; }
.group-body.collapsed { display:none; }

.widget-grid {
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-flex-wrap:wrap; flex-wrap:wrap; padding:6px 4px 2px;
}
.widget-card {
  -webkit-box-sizing:border-box; box-sizing:border-box;
  width:-webkit-calc(25% - 12px); width:calc(25% - 12px);
  min-width:115px; height:130px; margin:6px; border-radius:12px;
  cursor:pointer; position:relative;
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-flex-direction:column; flex-direction:column;
  -webkit-justify-content:center; justify-content:center;
  -webkit-align-items:center; align-items:center; overflow:hidden;
  -webkit-user-select:none; user-select:none;
  -webkit-transition:background-color .28s; transition:background-color .28s;
}
.widget-card:active { opacity:.75; }
.wicon { font-size:28px; line-height:1.15; pointer-events:none; }
.wlabel {
  font-size:11px; font-weight:700; color:#fff; text-align:center;
  padding:2px 7px; margin-top:3px;
  text-shadow:0 1px 5px rgba(0,0,0,.95);
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  pointer-events:none;
}
.wvalue { font-size:13px; color:#fff; margin-top:2px; text-shadow:0 1px 5px rgba(0,0,0,.95); pointer-events:none; }
.wremove {
  position:absolute; top:5px; right:6px;
  background:rgba(0,0,0,.38); color:#fff; border:none; border-radius:50%;
  width:20px; height:20px; font-size:11px; line-height:20px; text-align:center;
  cursor:pointer; padding:0; z-index:2;
}
.wsrc { position:absolute; bottom:4px; left:7px; font-size:9px; color:rgba(255,255,255,.5); pointer-events:none; }

.wslider {
  width:-webkit-calc(100% - 18px); width:calc(100% - 18px);
  margin:5px 9px 0; -webkit-appearance:none; appearance:none;
  height:5px; border-radius:3px; background:rgba(255,255,255,.3); outline:none; cursor:pointer;
}
.wslider::-webkit-slider-thumb {
  -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
  background:#fff; cursor:pointer; -webkit-box-shadow:0 1px 5px rgba(0,0,0,.45); box-shadow:0 1px 5px rgba(0,0,0,.45);
}
.wslider::-moz-range-thumb { width:20px; height:20px; border-radius:50%; background:#fff; cursor:pointer; border:none; }

.charts-area { padding:0 2px; }
.chart-wrap { background:#1e1e1e; margin:8px; padding:10px 12px; border-radius:8px; }
.chart-header {
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-justify-content:space-between; justify-content:space-between;
  -webkit-align-items:center; align-items:center; margin-bottom:6px;
}
.chart-title { font-size:13px; font-weight:600; }
.chart-remove { background:rgba(255,255,255,.12); color:#fff; border:none; border-radius:4px; width:26px; height:26px; font-size:13px; cursor:pointer; padding:0; }

#modal {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,.68); z-index:200; overflow-y:auto; text-align:center; padding:30px 0 20px;
}
#modal.open { display:block; }
.mbox {
  display:inline-block; text-align:left; background:#1e1e1e; border-radius:10px;
  padding:18px; width:90%; max-width:400px; vertical-align:top;
}
.mbox h3 { font-size:15px; margin-bottom:12px; }
.step { display:none; }
.step.active { display:block; }
.type-btn {
  display:block; width:100%; padding:12px 10px; margin:5px 0;
  background:#2d2d2d; color:#fff; border:1px solid #444; border-radius:8px;
  font-size:14px; cursor:pointer; text-align:left;
}
.fg { margin-top:10px; }
.fg label { display:block; font-size:11px; color:#999; margin-bottom:3px; }
.fg input[type="text"], .fg input[type="number"], .fg select {
  width:100%; padding:8px; background:#2a2a2a; color:#fff;
  border:1px solid #444; border-radius:4px; font-size:13px; -webkit-appearance:none; appearance:none;
}
.fg select[multiple] { height:110px; -webkit-appearance:none; }
.fg input:focus, .fg select:focus { outline:none; border-color:#0078d7; }
.rgroup { display:-webkit-box; display:-webkit-flex; display:flex; margin-top:6px; }
.rgroup label {
  display:-webkit-box; display:-webkit-flex; display:flex;
  -webkit-align-items:center; align-items:center;
  font-size:13px; cursor:pointer; margin-right:16px;
}
.rgroup input[type="radio"] { margin-right:5px; }
.mbtns { display:-webkit-box; display:-webkit-flex; display:flex; margin-top:14px; }
.mbtns button { -webkit-flex:1; flex:1; padding:10px; border:none; border-radius:6px; font-size:13px; cursor:pointer; margin-right:6px; }
.mbtns button:last-child { margin-right:0; }
.btn-p { background:#0078d7; color:#fff; }
.btn-s { background:#383838; color:#fff; }
.color-row { display:-webkit-box; display:-webkit-flex; display:flex; margin-top:6px; -webkit-flex-wrap:wrap; flex-wrap:wrap; }
.color-swatch { width:30px; height:30px; border-radius:6px; margin:3px; cursor:pointer; border:2px solid transparent; }
.color-swatch.selected { border-color:#fff; }
.tb-right { display:-webkit-box; display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; }
#stDot { color:#c0392b; font-size:12px; vertical-align:1px; }
#stDot.ok { color:#2ecc71; }
#setBtn { background:#333; color:#fff; border:1px solid #555; border-radius:4px; width:30px; height:28px;
  font-size:15px; margin-right:6px; cursor:pointer; padding:0; line-height:26px; }
#connBanner { display:none; background:#7a2a00; color:#fff; font-size:12px; padding:5px 12px; text-align:center; }
#connBanner.show { display:block; }
.fg input[type="password"] { width:100%; padding:8px; background:#2a2a2a; color:#fff;
  border:1px solid #444; border-radius:4px; font-size:13px; -webkit-appearance:none; appearance:none; }
.fg .chk { display:-webkit-box; display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; font-size:13px; color:#fff; }
.fg .chk input { margin-right:6px; }
.stinfo { font-size:11px; color:#999; line-height:1.6; background:#252525; border-radius:6px; padding:8px; margin-top:10px; }
.sechead { font-size:12px; color:#0a84ff; margin-top:14px; font-weight:700; }
.dl-link { display:block; text-align:center; color:#0a84ff; font-size:12px; margin-top:10px; }
</style>
</head>
<body>

<div id="topbar">
  <h2><span id="stDot" title="MQTT getrennt">&#9679;</span> MQTT Dashboard</h2>
  <div class="tb-right">
  <button id="setBtn" onclick="openSettings()" title="Einstellungen">&#9881;</button>
  <select id="rangeSelect" onchange="onRangeChange(this.value)">
    <option value="48">48 h</option>
    <option value="24" selected>24 h</option>
    <option value="12">12 h</option>
    <option value="6">6 h</option>
    <option value="1">1 h</option>
  </select>
  </div>
</div>

<div id="connBanner">Verbindung zum Dashboard getrennt &#8211; verbinde neu &#8230;</div>
<div id="vtBar" style="background:#111;padding:4px 10px;min-height:0;border-bottom:1px solid #222;"></div>

<div id="dashboard">
  <div id="grpsec_default">
    <div class="widget-grid" id="ggrid_default"></div>
    <div class="charts-area" id="gcharts_default"></div>
  </div>
</div>

<button id="addBtn" onclick="openModal()">+</button>

<div id="modal">
<div class="mbox">

  <div id="step1" class="step active">
    <h3>Was hinzuf&#252;gen?</h3>
    <button class="type-btn" onclick="selectType('group')">&#128193;&#160; Gruppe</button>
    <button class="type-btn" onclick="selectType('virtual')">&#128296;&#160; Virtuelles Topic</button>
    <button class="type-btn" onclick="selectType('chart')">&#128200;&#160; Diagramm</button>
    <button class="type-btn" onclick="selectType('button')">&#128308;&#160; Schaltfl&#228;che</button>
    <button class="type-btn" onclick="selectType('display')">&#128250;&#160; Anzeige</button>
    <div class="mbtns" style="margin-top:12px;">
      <button class="btn-s" onclick="closeModal()">Abbrechen</button>
    </div>
  </div>

  <div id="step2group" class="step">
    <h3>Gruppe erstellen</h3>
    <div class="fg"><label>Name</label><input type="text" id="gName" placeholder="z.B. Wohnzimmer"></div>
    <div class="fg">
      <label>Farbe</label>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="mbtns">
      <button class="btn-s" onclick="goStep('step1')">Zur&#252;ck</button>
      <button class="btn-p" onclick="confirmAddGroup()">Erstellen</button>
    </div>
  </div>

  <div id="step2virtual" class="step">
    <h3>Virtuelles Topic</h3>
    <div class="fg"><label>Name des virtuellen Topics (z.B. virtual/diff)</label><input type="text" id="vtName" placeholder="z.B. virtual/differenz"></div>
    <div class="fg"><label>Quell-Topics (Reihenfolge = a, b, c&#8230;)</label><select id="vtTopicSelect" multiple></select></div>
    <div class="fg"><label>Formel &#8212; z.B. <i>a&#160;-&#160;b</i></label><input type="text" id="vtFormula" placeholder="z.B. a - b  oder  (a + b) / 2"></div>
    <div class="mbtns">
      <button class="btn-s" onclick="goStep('step1')">Zur&#252;ck</button>
      <button class="btn-p" onclick="confirmAddVirtual()">Erstellen</button>
    </div>
  </div>

  <div id="step2chart" class="step">
    <h3>Diagramm</h3>
    <div class="fg"><label>Name</label><input type="text" id="chartName" placeholder="Diagramm-Name"></div>
    <div class="fg"><label>Topics w&#228;hlen (inkl. virtuelle, Mehrfachauswahl)</label><select id="topicSelect" multiple></select></div>
    <div class="fg"><label>Gruppe</label><select id="chartGroup"><option value="default">&#8212; Keine Gruppe &#8212;</option></select></div>
    <div class="mbtns">
      <button class="btn-s" onclick="goStep('step1')">Zur&#252;ck</button>
      <button class="btn-p" onclick="confirmAddChart()">Hinzuf&#252;gen</button>
    </div>
  </div>

  <div id="step2widget" class="step">
    <h3 id="widgetTitle">Schaltfl&#228;che</h3>
    <div class="fg"><label>Bezeichnung</label><input type="text" id="wName" placeholder="z.B. Wohnzimmer Licht"></div>
    <div class="fg"><label>Topic</label><input type="text" id="wTopic" placeholder="z.B. home/light/wz" list="knownList"><datalist id="knownList"></datalist></div>
    <div class="fg">
      <label>Ger&#228;t</label>
      <select id="wDevice">
        <option value="lamp">&#128161; Lampe</option>
        <option value="fan">&#127744; L&#252;fter</option>
        <option value="camera">&#128247; Kamera</option>
        <option value="shutter">&#9776; Rolladen</option>
        <option value="motion">&#128065; Bewegungsmelder</option>
        <option value="plug">&#128268; Steckdose</option>
        <option value="heating">&#128293; Heizung</option>
        <option value="ac">&#10052; Klimaanlage</option>
        <option value="lock">&#128274; Schloss</option>
        <option value="speaker">&#128266; Lautsprecher</option>
        <option value="sensor">&#128202; Sensor</option>
        <option value="generic">&#9881; Ger&#228;t</option>
      </select>
    </div>
    <div class="fg"><label>Gruppe</label><select id="wGroup"><option value="default">&#8212; Keine Gruppe &#8212;</option></select></div>
    <div id="subtypeRow" class="fg">
      <label>Typ</label>
      <div class="rgroup">
        <label><input type="radio" name="wSubtype" value="switch" checked onchange="onSubtypeChange()"> Schalter</label>
        <label><input type="radio" name="wSubtype" value="slider" onchange="onSubtypeChange()"> Slider</label>
      </div>
    </div>
    <div id="switchFields">
      <div class="fg"><label>Payload &#8211; Aktiviert (AN)</label><input type="text" id="wPayloadOn" placeholder="z.B. 1 oder ON"></div>
      <div class="fg"><label>Payload &#8211; Deaktiviert (AUS)</label><input type="text" id="wPayloadOff" placeholder="z.B. 0 oder OFF"></div>
    </div>
    <div id="sliderFields" style="display:none;">
      <div class="fg"><label>Minimum</label><input type="number" id="wSlMin" value="0"></div>
      <div class="fg"><label>Maximum</label><input type="number" id="wSlMax" value="100"></div>
      <div class="fg"><label>Schritt</label><input type="number" id="wSlStep" value="1"></div>
    </div>
    <div class="mbtns">
      <button class="btn-s" onclick="goStep('step1')">Zur&#252;ck</button>
      <button class="btn-p" onclick="confirmAddWidget()">Hinzuf&#252;gen</button>
    </div>
  </div>

  <div id="stepSettings" class="step">
    <h3>Einstellungen</h3>
    <div class="sechead">MQTT-Broker</div>
    <div class="fg"><label>Broker (IP oder Name, optional :Port)</label><input type="text" id="sBroker" placeholder="z.B. 192.168.1.10 oder 192.168.1.10:1883"></div>
    <div class="fg"><label>Benutzer (optional)</label><input type="text" id="sUser"></div>
    <div class="fg"><label>Passwort (leer = unver&#228;ndert)</label><input type="password" id="sPass"></div>
    <div class="sechead">Netzwerk (&#196;nderung &#8594; Neustart)</div>
    <div class="fg"><label class="chk"><input type="checkbox" id="sDhcp" onchange="onDhcpChange()"> DHCP verwenden</label></div>
    <div id="staticFields">
      <div class="fg"><label>IP-Adresse</label><input type="text" id="sIp"></div>
      <div class="fg"><label>Subnetzmaske</label><input type="text" id="sMask"></div>
      <div class="fg"><label>Gateway</label><input type="text" id="sGw"></div>
      <div class="fg"><label>DNS</label><input type="text" id="sDns"></div>
    </div>
    <div class="fg"><label>Hostname</label><input type="text" id="sHost"></div>
    <div class="fg"><label>NTP-Server</label><input type="text" id="sNtp"></div>
    <div class="stinfo" id="sInfo"></div>
    <a class="dl-link" href="/config.json">Konfiguration herunterladen (Backup)</a>
    <div class="mbtns">
      <button class="btn-s" onclick="closeModal()">Abbrechen</button>
      <button class="btn-s" onclick="if(confirm('Gerät neu starten?')) socket.emit('reboot')">Neustart</button>
      <button class="btn-p" onclick="saveSettings()">Speichern</button>
    </div>
  </div>

</div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   MQTT Dashboard – Client JS  (iOS 9 kompatibel, ES5/ES6)

   Performance-Design:
   - originalData speichert {x: ms_number, y: number} – kein Date-Parsing im Filterloop
   - Timestamps vom Server als ms-Integer
   - filterAllCharts: binäre Suche für Cutoff statt linearer Scan
   - chart.update('none') statt chart.update(0) wo möglich
   - Decimierung: Chart.js bekommt max. MAX_DISP Punkte
   - Throttle: Server sendet max. 1 Update/s pro Topic;
               Client zeichnet max. 1x/s neu (debounce)
   ══════════════════════════════════════════════════════════════ */

/* ── WebSocket-Verbindung (ersetzt Socket.IO der PC-Version) ── */
var socket = (function() {
  var ws = null, handlers = {}, queue = [], isOpen = false, retry = 1000, everOpen = false;
  function fire(e, d) { var h = handlers[e]; if (h) for (var i = 0; i < h.length; i++) h[i](d); }
  function connect() {
    try { ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"); }
    catch (e) { setTimeout(connect, retry); return; }
    ws.onopen = function() {
      isOpen = true; retry = 1000;
      document.getElementById("connBanner").className = "";
      if (everOpen) { location.reload(); return; }
      everOpen = true;
      while (queue.length) ws.send(queue.shift());
      fire("connect");
    };
    ws.onmessage = function(ev) { var m; try { m = JSON.parse(ev.data); } catch (e) { return; } fire(m.e, m.d); };
    ws.onclose = function() {
      isOpen = false;
      document.getElementById("connBanner").className = "show";
      setDot(false);
      setTimeout(connect, retry); retry = Math.min(retry * 2, 10000);
    };
    ws.onerror = function() { try { ws.close(); } catch (e) {} };
  }
  connect();
  return {
    on: function(e, f) { (handlers[e] = handlers[e] || []).push(f); },
    emit: function(e, d) {
      var s = JSON.stringify({ e: e, d: d === undefined ? null : d });
      if (isOpen) ws.send(s); else queue.push(s);
    }
  };
})();
var charts            = {};
var chartFormulas     = {};   /* nicht mehr genutzt, Kompatibilität */
var selectedRange     = 24;
var selectedRangeMs   = 24 * 3600000;
var currentWidgetType = "button";
var topicStates       = {};
var activeWidgetsJs   = {};
var activeGroupsJs    = {};
var activeVirtualTopicsJs = {};

/* Max. Punkte die an Chart.js übergeben werden (Render-Performance) */
var MAX_DISP = 800;

/* ── Gruppen-Farben ─────────────────────────────────────────── */
var GROUP_COLORS = [
  "#1e2d1e","#1e1e2d","#2d1e1e","#2d2a1e","#1e2a2d","#2a1e2d",
  "#263020","#202630","#302020","#303025","#202530","#252030"
];
var selectedGroupColor = GROUP_COLORS[0];

/* ── Gerätedefinitionen ─────────────────────────────────────── */
var DEVICES = {
  lamp:    { icon: "&#128161;", on: "#f5c518", onR: "#c8a010", off: "#3a3010" },
  fan:     { icon: "&#127744;", on: "#18a8f5", onR: "#1278b5", off: "#0d2a40" },
  camera:  { icon: "&#128247;", on: "#f53c18", onR: "#b52c10", off: "#3a1008" },
  shutter: { icon: "&#9776;",   on: "#78b5f5", onR: "#5090c0", off: "#0d2035" },
  motion:  { icon: "&#128065;", on: "#f5d018", onR: "#c0a010", off: "#383010" },
  plug:    { icon: "&#128268;", on: "#18f578", onR: "#10b550", off: "#083a20" },
  heating: { icon: "&#128293;", on: "#f57c18", onR: "#b55010", off: "#3a2008" },
  ac:      { icon: "&#10052;",  on: "#18c8f5", onR: "#1098b5", off: "#083040" },
  lock:    { icon: "&#128274;", on: "#a018f5", onR: "#7010b5", off: "#200840" },
  speaker: { icon: "&#128266;", on: "#18f5e1", onR: "#10b5a0", off: "#083a38" },
  sensor:  { icon: "&#128202;", on: "#f518c8", onR: "#b51090", off: "#3a0830" },
  generic: { icon: "&#9881;",   on: "#78f518", onR: "#50b510", off: "#1a3a08" }
};
function getDeviceDef(k) { return DEVICES[k] || DEVICES.generic; }
function getWidgetBg(w, state) {
  var dev = getDeviceDef(w.device);
  if (!state) return dev.off;
  var isOn = w.payload_on !== undefined && state.value === w.payload_on;
  return isOn ? (state.source === "self" ? dev.on : dev.onR) : dev.off;
}

/* ── Binäre Suche: erster Index >= cutoffMs ─────────────────── */
function bisectLeft(arr, cutoffMs) {
  var lo = 0, hi = arr.length;
  while (lo < hi) {
    var mid = (lo + hi) >>> 1;
    if (arr[mid].x < cutoffMs) lo = mid + 1; else hi = mid;
  }
  return lo;
}

/* ── Gleichmäßige Decimierung ───────────────────────────────── */
function decimate(arr, maxPts) {
  if (arr.length <= maxPts) return arr;
  var out = [];
  var step = arr.length / maxPts;
  for (var i = 0; i < maxPts; i++) out.push(arr[Math.round(i * step)]);
  return out;
}

/* ── Range ──────────────────────────────────────────────────── */
function onRangeChange(v) {
  selectedRange   = parseInt(v, 10);
  selectedRangeMs = selectedRange * 3600000;
  /* Bei manueller Range-Änderung sofort und ohne Debounce neu zeichnen */
  if (_filterTimer) { clearTimeout(_filterTimer); _filterTimer = null; }
  _doFilterAllCharts();
}

/* ── Verlauf vom Geraet (Ringpuffer: fein 30 s / grob 4 min) ── */
var histCache = {};
function expandHist(h) {
  var out = [], i, t;
  var fineStart = h.fine ? h.fine.t0 : Infinity;
  if (h.coarse) {
    for (i = 0; i < h.coarse.v.length; i++) {
      t = h.coarse.t0 + i * h.coarse.step;
      if (t >= fineStart) break;
      if (h.coarse.v[i] !== null) out.push({ x: t + h.coarse.step / 2, y: h.coarse.v[i] });
    }
  }
  if (h.fine) {
    for (i = 0; i < h.fine.v.length; i++) {
      if (h.fine.v[i] !== null) out.push({ x: h.fine.t0 + i * h.fine.step + h.fine.step / 2, y: h.fine.v[i] });
    }
  }
  return out;
}
socket.on("topic_hist", function(h) {
  var pts = expandHist(h);
  histCache[h.topic] = pts;
  var lastTs = pts.length ? pts[pts.length - 1].x : 0;
  var ids = Object.keys(charts);
  for (var i = 0; i < ids.length; i++) {
    var ch = charts[ids[i]];
    for (var j = 0; j < ch.data.datasets.length; j++) {
      var ds = ch.data.datasets[j];
      if (ds.label !== h.topic) continue;
      var live = [];
      for (var k = 0; k < ds.originalData.length; k++) if (ds.originalData[k].x > lastTs) live.push(ds.originalData[k]);
      ds.originalData = pts.concat(live);
    }
  }
  if (_filterTimer) { clearTimeout(_filterTimer); _filterTimer = null; }
  _schedDraw();
});

/* ── MQTT-Aktualisierungen ──────────────────────────────────── */
socket.on("mqtt_update", function(d) {
  topicStates[d.topic] = { value: d.value, source: d.source };
  updateWidgetStates(d.topic, topicStates[d.topic]);
  if (d.numeric !== null && d.numeric !== undefined) {
    var tsMs = typeof d.ts === "number" ? d.ts : new Date(d.ts).getTime();
    /* Geraeteuhr noch nicht gestellt -> Browserzeit verwenden */
    if (Math.abs(tsMs - Date.now()) > 120000) tsMs = Date.now();
    var ids = Object.keys(charts);
    for (var i = 0; i < ids.length; i++) {
      var ch = charts[ids[i]];
      for (var j = 0; j < ch.data.datasets.length; j++) {
        var ds = ch.data.datasets[j];
        if (ds.label === d.topic) ds.originalData.push({ x: tsMs, y: d.numeric });
      }
    }
    if (histCache[d.topic]) histCache[d.topic].push({ x: tsMs, y: d.numeric });
    filterAllCharts();
  }
});

/* ── Filter mit binärer Suche + Decimierung ─────────────────── */
var _filterTimer  = null;
var _pendingDraw  = false;   /* requestAnimationFrame Guard */

function filterAllCharts() {
  /* Debounce: frühestens 2s nach letztem Aufruf neu zeichnen          */
  /* So werden Bursts von mqtt_updates zu einem einzigen Redraw gebündelt */
  if (_filterTimer) return;
  _filterTimer = setTimeout(function() {
    _filterTimer = null;
    _schedDraw();
  }, 2000);
}

function _schedDraw() {
  if (_pendingDraw) return;
  _pendingDraw = true;
  /* requestAnimationFrame ist in iOS 9 vorhanden */
  var raf = window.requestAnimationFrame || function(cb){ setTimeout(cb, 16); };
  raf(function() { _pendingDraw = false; _doFilterAllCharts(); });
}

function _doFilterAllCharts() {
  var now      = Date.now();
  var cutoffMs = now - selectedRangeMs;

  var unit;
  if      (selectedRange <= 2)  unit = "minute";
  else if (selectedRange <= 24) unit = "hour";
  else                          unit = "day";

  var ids = Object.keys(charts);
  for (var i = 0; i < ids.length; i++) {
    var chart = charts[ids[i]];
    for (var j = 0; j < chart.data.datasets.length; j++) {
      var ds   = chart.data.datasets[j];
      var orig = ds.originalData;
      var start = bisectLeft(orig, cutoffMs);
      ds.data = decimate(orig.slice(start), MAX_DISP);
    }
    /* Zeiteinheit setzen – KEIN ticks.min/max, das verursacht Flackern.
       Chart.js skaliert die Achse automatisch anhand ds.data.            */
    chart.options.scales.xAxes[0].time.unit = unit;
    /* update(0) ist in Chart.js 2.x stabiler als update("none")
       wenn sich die Achsenskalierung ändert.                              */
    chart.update(0);
  }
}

  for (var vt = 0; vt < vtList.length; vt++) { activeVirtualTopicsJs[vtList[vt].id]=vtList[vt]; renderVirtualTopic(vtList[vt]); }
  var groups = data.groups || [];
  for (var g = 0; g < groups.length; g++) { activeGroupsJs[groups[g].id]=groups[g]; renderGroup(groups[g]); }
  refreshGroupSelects();
  for (var i = 0; i < data.widgets.length; i++) { activeWidgetsJs[data.widgets[i].id]=data.widgets[i]; renderWidget(data.widgets[i]); }
  for (var j = 0; j < data.charts.length; j++) {
    var c = data.charts[j];
    createChart(c.chart_id, c.datasets, c.name, c.group_id);
  }
});

  document.getElementById("sUser").value = s.mqtt_user || "";
  document.getElementById("sPass").value = "";
  document.getElementById("sPass").placeholder = s.mqtt_password_set ? "\u2022\u2022\u2022\u2022 (gesetzt)" : "";
  document.getElementById("sDhcp").checked = !!s.dhcp;
  document.getElementById("sIp").value = s.ip || "";
  document.getElementById("sMask").value = s.mask || "";
  document.getElementById("sGw").value = s.gw || "";
  document.getElementById("sDns").value = s.dns || "";
  document.getElementById("sHost").value = s.hostname || "";
  document.getElementById("sNtp").value = s.ntp || "";
  onDhcpChange();
  renderStatus(s.status);
});
function saveSettings() {
  var d = {
    broker: document.getElementById("sBroker").value.trim(),
    mqtt_user: document.getElementById("sUser").value.trim(),
    dhcp: document.getElementById("sDhcp").checked,
    ip: document.getElementById("sIp").value.trim(),
    mask: document.getElementById("sMask").value.trim(),
    gw: document.getElementById("sGw").value.trim(),
    dns: document.getElementById("sDns").value.trim(),
    hostname: document.getElementById("sHost").value.trim(),
    ntp: document.getElementById("sNtp").value.trim()
  };
  var pw = document.getElementById("sPass").value;
  if (pw) d.mqtt_password = pw;
  socket.emit("save_settings", d);
}
socket.on("settings_saved", function(r) {
  closeModal();
  if (r.reboot) alert("Netzwerkeinstellungen gespeichert. Das Ger\u00e4t startet neu \u2013 ggf. die neue IP-Adresse im Browser aufrufen.");
});

/* ── Speicher-Aufräumer (alle 5 Min.) ───────────────────────── */
setInterval(function() {
  var cutoff48 = Date.now() - 48 * 3600000;
  var ids = Object.keys(charts);
  for (var i = 0; i < ids.length; i++) {
    var ch = charts[ids[i]];
    for (var j = 0; j < ch.data.datasets.length; j++) {
      var ds = ch.data.datasets[j];
      var start = bisectLeft(ds.originalData, cutoff48);
      if (start > 0) ds.originalData = ds.originalData.slice(start);
    }
  }
  var hk = Object.keys(histCache);
  for (var h = 0; h < hk.length; h++) {
    var hs = bisectLeft(histCache[hk[h]], cutoff48);
    if (hs > 0) histCache[hk[h]] = histCache[hk[h]].slice(hs);
  }
  if (_filterTimer) { clearTimeout(_filterTimer); _filterTimer = null; }
  _schedDraw();
}, 300000);
</script>
